name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Home Assistant and recorder dependencies
        run: python -m pip install homeassistant==2026.9.1 SQLAlchemy==2.0.52 fnv-hash-fast==2.0.3 psutil-home-assistant==0.0.1
      - name: Import integration against Home Assistant
        run: python -c 'import custom_components.energy_price_comparison.sensor; import custom_components.energy_price_comparison.config_flow'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile all integration files
        run: python -m compileall -q custom_components
